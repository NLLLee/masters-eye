<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>大师之眼 · The Masters' Eye — 世界经典摄影审美训练馆</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;900&family=Noto+Sans+SC:wght@300;400;500;700&family=Cormorant+Garamond:ital,wght@0,500;0,700;1,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css?v=5">
</head>
<body>

<header class="site-header">
  <div class="header-inner">
    <div class="brand">
      <h1>大师之眼<span class="brand-en">The Masters' Eye</span></h1>
      <p class="tagline" id="tagline">世界经典摄影作品鉴赏 · 审美训练馆</p>
    </div>
    <div class="header-tools">
      <input id="searchInput" type="search" placeholder="搜索摄影师 / 作品 / 关键词…" aria-label="搜索">
      <button id="langBtn" class="lang-btn" type="button" title="切换语言 / Switch language">EN</button>
    </div>
  </div>
</header>

<section class="hero">
  <p class="hero-line" id="heroLine"></p>
  <p class="hero-stats" id="heroStats"></p>
  <details class="howto" id="howtoBox"></details>
</section>

<nav class="view-switch" id="viewSwitch">
  <button class="view-tab active" data-view="masters" type="button"></button>
  <button class="view-tab" data-view="awards" type="button"></button>
  <button class="view-tab" data-view="cloud" type="button"></button>
</nav>

<!-- ============ 视图一：大师精选 ============ -->
<section id="mastersView" class="view-section">
  <nav class="filters">
    <div class="cat-tabs" id="catTabs"></div>
    <div class="filter-row">
      <select id="sourceSelect" aria-label="source filter"></select>
      <button id="favToggle" class="chip-btn" type="button"></button>
    </div>
  </nav>
  <main>
    <div class="grid" id="grid"></div>
    <p class="empty" id="emptyMsg" hidden></p>
  </main>
</section>

<!-- ============ 视图二：年度大奖时间轴 ============ -->
<section id="awardsView" class="view-section" hidden>
  <nav class="filters">
    <div class="cat-tabs" id="awardChips"></div>
    <div class="filter-row">
      <select id="yearSelect" aria-label="year filter"></select>
    </div>
  </nav>
  <main>
    <p class="section-note" id="awardsNote"></p>
    <details class="archives" id="archivesBox">
      <summary id="archivesTitle"></summary>
      <div class="arch-grid" id="archivesList"></div>
    </details>
    <div id="awardsTimeline"></div>
    <p class="empty" id="awardsEmpty" hidden></p>
  </main>
</section>

<!-- ============ 视图三：云端图库 ============ -->
<section id="cloudView" class="view-section" hidden>
  <nav class="filters">
    <div class="cat-tabs" id="cloudTabs"></div>
    <div class="filter-row">
      <select id="cloudYearSelect" aria-label="year filter"></select>
      <span class="cloud-count" id="cloudCount"></span>
    </div>
  </nav>
  <main>
    <p class="section-note" id="cloudNote"></p>
    <div class="grid" id="cloudGrid"></div>
    <p class="empty" id="cloudStatus" hidden></p>
    <div class="load-more-wrap"><button id="cloudMore" class="btn-primary" type="button" hidden></button></div>
  </main>
</section>

<button id="randomBtn" class="random-btn" type="button"></button>

<div class="modal" id="modal" hidden>
  <div class="modal-backdrop" data-close></div>
  <div class="modal-card" role="dialog" aria-modal="true">
    <button class="modal-close" data-close aria-label="close">×</button>
    <div class="modal-visual" id="modalVisual"></div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<footer class="site-footer">
  <p id="footerCopyright"></p>
  <p id="footerImages"></p>
</footer>

<script src="data.js"></script>
<script src="data-awards.js"></script>
<script src="data-i18n.js"></script>
<script src="app.js?v=5"></script>
</body>
</html>
